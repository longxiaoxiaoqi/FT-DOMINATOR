<script>
const icon=id=>`<svg aria-hidden="true"><use href="#i-${id}"/></svg>`;
const brand=()=>`<div class="brand"><span class="mark">FT</span><div><strong>资源管理平台</strong><small>TEST RESOURCE CENTER</small></div></div>`;
const navItems=[['chip','芯片型号'],['factory','封装厂'],['stock','库存总览'],['doc','图纸中心'],['task','进度事项'],['grid','基础资料']];
const sidebar=()=>`<aside class="sidebar">${brand()}<div class="nav-title">资源工作台</div><nav class="nav">${navItems.map(([id,label])=>`<button class="${id==='factory'?'selected':''}">${icon(id)}${label}</button>`).join('')}</nav><div class="nav-title">系统管理</div><nav class="nav"><button>${icon('user')}用户管理</button><button>${icon('audit')}操作记录</button></nav><div class="profile"><span class="avatar">L</span><div>lxq<small>管理员</small></div><span class="dots">···</span></div></aside>`;
const topbar=()=>`<header class="topbar"><div class="crumb">工作台 <span class="slash">/</span> <strong>封装厂</strong></div><div class="top-right"><span class="sync"><i></i>共享资料 · 协同维护</span><button class="btn quiet">${icon('refresh')}刷新</button></div></header>`;
const mainActions=()=>`<div class="actions"><button class="btn">${icon('down')}导出筛选结果</button><button class="btn primary">${icon('plus')}新增封装厂</button></div>`;
const filters=(labels=true)=>`<div class="filters"><label class="field">${labels?'搜索封装厂':''}<div class="searchbox">${icon('search')}<input placeholder="搜索名称、厂区或联系人"></div></label><label class="field">${labels?'启用状态':''}<select><option>全部状态</option></select></label><label class="check"><input type="checkbox">包含停用</label><button class="btn primary">查询</button><button class="btn quiet">重置</button></div>`;
const status=()=>`<span class="status">启用</span>`;
const factories=['南京芯德','江苏尊阳'];
